<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E63946">
<title>Perfil de emergencia médica</title>
<style>
  :root{
    --red:#E63946; --red-dark:#B82A36; --red-soft:#FDECEE;
    --green:#25D366; --green-dark:#128C4A;
    --ink:#1B1F24; --muted:#5F6670; --bg:#F2F3F5; --card:#FFFFFF; --line:#E1E4E8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.45}
  body{min-height:100vh;padding-bottom:calc(170px + env(safe-area-inset-bottom))}
  .wrap{max-width:480px;margin:0 auto}

  /* Encabezado */
  .alert-bar{background:var(--red);color:#fff;text-align:center;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    font-weight:800;font-size:1.05rem;letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .alert-bar svg{width:26px;height:26px;flex:none;animation:pulse 1.8s ease-in-out 3}
  @keyframes pulse{50%{transform:scale(1.18)}}

  main{padding:16px}
  .card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--line)}

  /* Tarjeta principal */
  .profile{text-align:center;padding-top:26px}
  .photo{width:132px;height:132px;border-radius:50%;object-fit:cover;
    border:5px solid #fff;box-shadow:0 0 0 4px var(--red);background:var(--line);
    display:block;margin:0 auto 14px}
  .photo-ph{display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .photo-ph svg{width:64px;height:64px}
  .name{font-size:1.85rem;line-height:1.15;font-weight:800;word-break:break-word}
  .blood{display:inline-flex;align-items:center;gap:10px;margin-top:16px;
    background:var(--red);color:#fff;border-radius:16px;padding:10px 22px}
  .blood small{font-size:.8rem;font-weight:600;opacity:.92;text-align:left;line-height:1.1}
  .blood strong{font-size:2.2rem;font-weight:900;line-height:1}

  /* Alertas médicas */
  .medical{background:var(--red-soft);border:2px solid var(--red)}
  .medical h2{color:var(--red-dark);font-size:1.05rem;font-weight:800;margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  .medical h2 svg{width:22px;height:22px}
  .medical p{font-size:1.2rem;font-weight:600;white-space:pre-line;word-break:break-word}

  .extra h2{font-size:1rem;font-weight:700;color:var(--muted);margin-bottom:6px}
  .extra p{white-space:pre-line;word-break:break-word}

  /* Reproductor de audio */
  .audio-btn{width:100%;border:0;border-radius:16px;background:var(--ink);color:#fff;
    font:inherit;font-weight:700;font-size:1.1rem;padding:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:12px}
  .audio-btn svg{width:28px;height:28px}
  .audio-btn.playing{background:var(--red-dark)}
  .progress{height:8px;border-radius:4px;background:var(--line);margin-top:14px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--red)}
  .time{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px}

  /* Acciones fijas */
  .actions{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .actions .wrap{display:grid;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    min-height:62px;border:0;border-radius:16px;font:inherit;font-weight:800;
    font-size:1.1rem;color:#fff;text-decoration:none;cursor:pointer;padding:10px 16px;text-align:center}
  .btn svg{width:26px;height:26px;flex:none}
  .btn-call{background:var(--red)}
  .btn-call:active{background:var(--red-dark)}
  .btn-wa{background:var(--green);color:#06351A}
  .btn-wa:active{background:var(--green-dark);color:#fff}
  .btn[disabled]{opacity:.7}
  .hint{font-size:.8rem;color:var(--muted);text-align:center;min-height:1.1em}

  /* Estados */
  .state{min-height:70vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;gap:14px;padding:24px}
  .state h1{font-size:1.4rem}
  .state p{color:var(--muted);max-width:30ch}
  .spinner{width:56px;height:56px;border-radius:50%;border:6px solid var(--line);
    border-top-color:var(--red);animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err-icon{width:64px;height:64px;color:var(--red)}

  /* Cambiar foto */
  .photo-wrap{position:relative;width:132px;margin:0 auto 14px}
  .photo-wrap .photo{margin:0}
  .cam{position:absolute;right:-6px;bottom:-2px;width:46px;height:46px;border-radius:50%;
    border:3px solid #fff;background:var(--ink);color:#fff;display:flex;align-items:center;
    justify-content:center;cursor:pointer}
  .cam svg{width:22px;height:22px}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:50}
  .sheet-box{width:100%;max-width:480px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
  .sheet-box h2{font-size:1.25rem}
  .pick{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:14px;
    border:2px dashed var(--muted);font-weight:700;cursor:pointer;color:var(--ink)}
  .pick input{display:none}
  .preview{width:160px;height:160px;border-radius:50%;object-fit:cover;margin:0 auto;
    border:4px solid var(--red)}
  .field{font:inherit;font-size:1.1rem;padding:14px;border:2px solid var(--line);border-radius:12px;width:100%}
  .btn-ghost{background:var(--line);color:var(--ink)}
  .msg{min-height:1.2em;font-size:.95rem;text-align:center}
  .msg.err{color:var(--red-dark);font-weight:700}
  .msg.ok{color:var(--green-dark);font-weight:700}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="alert-bar" role="banner">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
  PERFIL DE EMERGENCIA MÉDICA
</div>

<div class="wrap">
  <!-- Cargando -->
  <div id="loading" class="state" role="status" aria-live="polite">
    <div class="spinner"></div>
    <p>Cargando ficha médica…</p>
  </div>

  <!-- Error -->
  <div id="error" class="state hidden" role="alert">
    <svg class="err-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
    <h1 id="error-title"></h1>
    <p id="error-text"></p>
  </div>

  <!-- Ficha -->
  <main id="profile" class="hidden"></main>
</div>


<!-- Cambiar foto -->
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-box">
    <h2 id="sheet-title">Cambiar foto de perfil</h2>
    <img id="preview" class="preview hidden" alt="Vista previa">
    <label class="pick">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <span id="pick-label">Elegir de mi galería</span>
      <input id="file" type="file" accept="image/*">
    </label>
    <input id="pin" class="field" type="password" inputmode="numeric" autocomplete="off" placeholder="Clave de edición">
    <div id="sheet-msg" class="msg" aria-live="polite"></div>
    <button id="save-photo" class="btn btn-call" type="button" disabled>Guardar foto</button>
    <button id="cancel-photo" class="btn btn-ghost" type="button">Cancelar</button>
  </div>
</div>

<!-- Botones de acción -->
<div id="actions" class="actions hidden">
  <div class="wrap">
    <a id="btn-call" class="btn btn-call" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
      <span id="call-label"></span>
    </a>
    <button id="btn-wa" class="btn btn-wa" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.1-1.3A10 10 0 1 0 12 2zm5.2 14c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500.2.600.8 2 .9 2.100.1.100.1.300 0 .4-.4.700-.8.700-.5 1.200.7 1.100 1.500 1.900 2.700 2.500.4.200.6.200.8-.1.200-.3.900-1 1.100-1.400.2-.3.500-.3.700-.2l2 1c.3.100.5.200.5.300.1.200.1.800-.1 1.200z"/></svg>
      <span>Enviar WhatsApp con mi ubicación</span>
    </button>
    <div id="hint" class="hint" aria-live="polite"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN: pega aquí el enlace CSV público de tu Google Sheet
   (Archivo → Compartir → Publicar en la Web → CSV)
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1SkEGWTWBgAO25VSWRUtu17oJutR5bn8owWxR0fSJqFU/export?format=csv&gid=0";

/* URL de tu Apps Script (Implementar → Aplicación web). Guía en apps_script.gs.
   Si la dejas sin configurar, el botón de cambiar foto no aparece. */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFdtckY0Z3bsqD41xSy5dZpJczyDRrJORe8JOPHSq1kMrARqLFoDG12yjnJX4en9XhKA/exec";

/* ---------- Utilidades ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const digits = (s) => String(s ?? "").replace(/\D/g, "");

/* Parser CSV robusto (comillas, comas y saltos de línea dentro de celdas) */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}

function showError(title, text) {
  $("loading").classList.add("hidden");
  $("profile").classList.add("hidden");
  $("actions").classList.add("hidden");
  $("error-title").textContent = title;
  $("error-text").textContent = text;
  $("error").classList.remove("hidden");
}

/* Google Drive: convierte enlaces de "compartir" en enlaces directos */
function directLink(url) {
  url = (url || "").trim();
  // Enlaces de Google Imágenes (imgres?imgurl=...): extrae la imagen real
  const im = url.match(/google\.[a-z.]+\/imgres\?.*?imgurl=([^&]+)/);
  if (im) { try { url = decodeURIComponent(im[1]); } catch (e) {} }
  const m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? "https://drive.google.com/uc?export=view&id=" + m[1] : url;
}
function directAudio(url) {
  url = (url || "").trim();
  const m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? "https://drive.google.com/uc?export=download&id=" + m[1] : url;
}

const fmt = (t) => {
  if (!isFinite(t)) return "0:00";
  return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
};

/* ---------- Iconos ---------- */
const ICON_USER = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.200-8 5v1h16v-1c0-2.800-3.600-5-8-5z"/></svg>';
const ICON_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.700 3.900a2 2 0 0 0-3.400 0z"/><path d="M12 9v4M12 17h.01"/></svg>';

/* ---------- Render ---------- */
function render(p) {
  const nombre = p.nombre || "Sin nombre";
  const tel = digits(p.contacto1_tel);
  const contacto = p.contacto1_nombre || "contacto de emergencia";

  let html = '<section class="card profile">';
  html += '<div class="photo-wrap" id="photo-wrap">';
  html += p.foto
    ? `<img class="photo" id="photo" alt="Foto de ${esc(nombre)}" src="${esc(directLink(p.foto))}">`
    : `<div class="photo photo-ph" id="photo">${ICON_USER}</div>`;
  if (!APPS_SCRIPT_URL.startsWith("PEGA_AQUI"))
    html += `<button class="cam" id="cam" type="button" aria-label="Cambiar foto">${ICON_CAM}</button>`;
  html += '</div>';
  html += `<h1 class="name">${esc(nombre)}</h1>`;
  if (p.sangre) html += `<div class="blood"><small>Tipo de<br>sangre</small><strong>${esc(p.sangre)}</strong></div>`;
  html += "</section>";

  html += `<section class="card medical"><h2>${ICON_ALERT} Alergias / condiciones médicas</h2>
    <p>${esc(p.alergias) || "Ninguna registrada"}</p></section>`;

  if (p.audio) {
    html += `<section class="card">
      <button id="audio-btn" class="audio-btn" type="button">${ICON_PLAY}<span>Escuchar nota de voz</span></button>
      <div class="progress"><i id="audio-bar"></i></div>
      <div class="time"><span id="audio-cur">0:00</span><span id="audio-dur">0:00</span></div>
      <audio id="audio" preload="metadata" src="${esc(directAudio(p.audio))}"></audio>
      <p id="audio-err" class="hint hidden">No se pudo reproducir el audio.</p>
    </section>`;
  }

  if (p.mensaje_extra) {
    html += `<section class="card extra"><h2>Información adicional</h2><p>${esc(p.mensaje_extra)}</p></section>`;
  }

  $("profile").innerHTML = html;

  // Foto: si falla, muestra marcador
  const photo = $("photo");
  if (photo) photo.onerror = () => {
    const ph = document.createElement("div");
    ph.className = "photo photo-ph"; ph.innerHTML = ICON_USER;
    photo.replaceWith(ph);
  };

  setupAudio();
  setupPhoto(p.id);
  setupActions(nombre, contacto, tel);

  $("loading").classList.add("hidden");
  $("profile").classList.remove("hidden");
  $("actions").classList.remove("hidden");
}

/* ---------- Audio ---------- */
function setupAudio() {
  const audio = $("audio"); if (!audio) return;
  const btn = $("audio-btn"), bar = $("audio-bar");
  const label = () => btn.querySelector("span");
  btn.onclick = () => {
    if (audio.paused) audio.play().catch(() => $("audio-err").classList.remove("hidden"));
    else audio.pause();
  };
  audio.onplay = () => { btn.classList.add("playing"); btn.innerHTML = ICON_PAUSE + "<span>Pausar nota de voz</span>"; };
  const reset = () => { btn.classList.remove("playing"); btn.innerHTML = ICON_PLAY + "<span>Escuchar nota de voz</span>"; };
  audio.onpause = reset;
  audio.onended = () => { reset(); bar.style.width = "0"; };
  audio.onloadedmetadata = () => $("audio-dur").textContent = fmt(audio.duration);
  audio.ontimeupdate = () => {
    $("audio-cur").textContent = fmt(audio.currentTime);
    bar.style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + "%";
  };
  audio.onerror = () => $("audio-err").classList.remove("hidden");
}


/* ---------- Cambiar foto desde la galería ---------- */
// Recorta al centro, reduce a 256 px y comprime a JPEG (<45 000 caracteres: límite de una celda de Sheets)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 256, c = document.createElement("canvas");
      c.width = c.height = S;
      const side = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let q = 0.8, out = c.toDataURL("image/jpeg", q);
      while (out.length > 45000 && q > 0.3) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      out.length > 45000 ? reject(new Error("big")) : resolve(out);
    };
    img.onerror = () => reject(new Error("img"));
    img.src = url;
  });
}

function setupPhoto(id) {
  const cam = $("cam"); if (!cam) return;
  const sheet = $("sheet"), msg = $("sheet-msg"), save = $("save-photo");
  let data = null;
  const say = (t, cls) => { msg.textContent = t; msg.className = "msg " + (cls || ""); };
  const close = () => { sheet.classList.add("hidden"); data = null; save.disabled = true;
    $("preview").classList.add("hidden"); $("file").value = ""; say(""); };

  cam.onclick = () => sheet.classList.remove("hidden");
  $("cancel-photo").onclick = close;

  $("file").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    say("Procesando foto…");
    try {
      data = await compressImage(f);
      $("preview").src = data; $("preview").classList.remove("hidden");
      $("pick-label").textContent = "Elegir otra foto";
      save.disabled = false; say("");
    } catch (err) { data = null; save.disabled = true; say("No se pudo leer esa imagen. Prueba con otra.", "err"); }
  };

  save.onclick = async () => {
    const pin = $("pin").value.trim();
    if (!data) return;
    if (!pin) return say("Escribe la clave de edición.", "err");
    save.disabled = true; say("Guardando…");
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita el preflight CORS
        body: JSON.stringify({ id, pin, foto: data })
      });
      const r = await res.json();
      if (!r.ok) throw new Error(r.error || "fail");
      const el = $("photo");
      const img = document.createElement("img");
      img.className = "photo"; img.id = "photo"; img.alt = "Foto de perfil"; img.src = data;
      el.replaceWith(img);
      say("Foto guardada ✔", "ok");
      setTimeout(close, 900);
    } catch (err) {
      save.disabled = false;
      say(err.message === "clave" ? "Clave incorrecta." : "No se pudo guardar. Revisa tu conexión.", "err");
    }
  };
}

/* ---------- Botones de acción ---------- */
function setupActions(nombre, contacto, tel) {
  $("call-label").textContent = "Llamar a " + contacto;
  const call = $("btn-call"), wa = $("btn-wa"), hint = $("hint");

  if (!tel) {
    call.removeAttribute("href"); call.style.opacity = ".5";
    wa.disabled = true; hint.textContent = "Esta ficha no tiene teléfono de contacto.";
    return;
  }
  call.href = "tel:+" + tel;

  const openWA = (mapsUrl) => {
    let msg = "🚨 EMERGENCIA: Estoy con " + nombre + " y necesita ayuda médica.";
    if (mapsUrl) msg += "\n📍 Ubicación exacta: " + mapsUrl;
    window.location.href = "https://wa.me/" + tel + "?text=" + encodeURIComponent(msg);
  };

  wa.onclick = () => {
    if (!navigator.geolocation) { hint.textContent = "Sin GPS disponible. Abriendo WhatsApp…"; return openWA(); }
    wa.disabled = true; hint.textContent = "Obteniendo ubicación…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        wa.disabled = false; hint.textContent = "";
        openWA("https://www.google.com/maps?q=" + latitude + "," + longitude);
      },
      () => { // permiso denegado, timeout o error: abre WhatsApp sin mapa
        wa.disabled = false; hint.textContent = "";
        openWA();
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
    );
  };
}

/* ---------- Carga de datos ---------- */
async function init() {
  const id = (new URLSearchParams(location.search).get("id") || "").trim();
  if (!id) return showError("Falta el ID", "Abre esta página con un ID en la URL, por ejemplo: index.html?id=001");
  if (SHEET_CSV_URL.startsWith("PEGA_AQUI")) return showError("Base de datos sin configurar", "Falta pegar el enlace CSV de Google Sheets en SHEET_CSV_URL.");

  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = parseCSV(await res.text());
    if (rows.length < 2) return showError("Sin datos", "La hoja de cálculo está vacía.");

    const head = rows[0].map(h => h.trim().toLowerCase());
    const idx = head.indexOf("id");
    if (idx < 0) return showError("Hoja mal configurada", "No se encontró la columna «id».");

    // Coincidencia exacta; también tolera ceros a la izquierda perdidos por Sheets (001 vs 1)
    const norm = (v) => String(v).trim().replace(/^0+(?=\d)/, "");
    const row = rows.slice(1).find(r => (r[idx] || "").trim() === id) ||
                rows.slice(1).find(r => norm(r[idx] || "") === norm(id));
    if (!row) return showError("Perfil no encontrado", "El ID «" + id + "» no existe en la base de datos.");

    const p = {};
    head.forEach((h, i) => p[h] = (row[i] || "").trim());
    render(p);
  } catch (e) {
    console.error(e);
    showError("No se pudo cargar", "Revisa tu conexión a internet e inténtalo de nuevo.");
  }
}
init();
</script>
